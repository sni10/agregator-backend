# Production stack of renews.me (server: /srv/renews). Values come from .env next to this file
# (see .env.production.example). IMAGE_TAG / FRONT_TAG = backend / frontend commit SHA, written by deploy/deploy.sh.
#
# No Caddy here: the server also runs the gallery (/srv/artai), whose Caddy owns ports 80/443. It imports
# deploy/caddy/renews.caddy, reaches app and front over the shared network "edge" (aliases renews-app, renews-front)
# and serves the media volume (renews_media) read-only. No service here may get a `ports:` section: Docker opens
# published ports past ufw.
x-logging: &logging
  driver: local
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm  # the gallery's image: already on the server
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  app:
    image: ghcr.io/sni10/agregator-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file: .env
    # One vCPU shared with the gallery: two workers are plenty for a news site behind the front's micro-cache
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60",
              "--access-logfile", "-"]
    volumes:
      - media:/app/media
    networks:
      default:
      edge:
        aliases: [renews-app]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Started only when FRONT_TAG is set in .env (deploy.sh adds --profile front): the API can go live first
  front:
    image: ghcr.io/sni10/agregator-front:${FRONT_TAG:-none}
    profiles: [front]
    environment:
      API_INTERNAL_URL: http://app:8000  # server render -> API inside this stack; image links are absolute anyway
    networks:
      default:
      edge:
        aliases: [renews-front]
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
    name: renews_media  # fixed name: the gallery's Caddy mounts it

networks:
  edge:
    external: true  # docker network create edge (once, see DEPLOY.md)
